<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registration | Youth Of The Nation 2026 — Freedom Festival</title>

<!-- SEO -->
<meta name="description" content="Register for Youth Of The Nation 2026 Freedom Festival. Join us for a sacred gathering of youth, worship, and God's presence in Rajahmundry.">

<meta name="theme-color" content="#050505">
<link rel="icon" href="../../logo.jpg">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;600;700;800;900&family=Figtree:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: #050505;
  --bg-card: rgba(14, 14, 18, 0.85);
  --gold: #D6A041;
  --gold-light: #F3CA7E;
  --gold-deep: #9B6A1D;
  --white: #F5F5F5;
  --text-muted: #9ca3af;
  --text-subtle: #71717a;
  --border-glass: rgba(255, 255, 255, 0.12);
  --border-gold: rgba(214, 160, 65, 0.35);
  --error: #f87171;
  --error-bg: rgba(248, 113, 113, 0.1);
  --error-border: rgba(248, 113, 113, 0.35);
  --success: #34d399;
}

html {
  scroll-behavior: smooth;
  background-color: var(--bg);
}

body {
  font-family: 'Figtree', sans-serif;
  background-color: var(--bg);
  color: var(--white);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 40px 20px 80px;
  position: relative;
  overflow-x: hidden;
  line-height: 1.6;
}

/* Background Atmosphere */
.bg-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.6;
}

.bg-spotlight {
  position: fixed;
  top: -20%;
  left: 50%;
  transform: translateX(-50%);
  width: 900px;
  height: 900px;
  background: radial-gradient(circle, rgba(214, 160, 65, 0.12) 0%, rgba(5, 5, 5, 0) 70%);
  pointer-events: none;
  z-index: 0;
}

/* Header & Navigation Bar */
.page-top-nav {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 640px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
}

.nav-back-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: 'Inter', sans-serif;
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-muted);
  text-decoration: none;
  padding: 8px 16px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.02);
  transition: all 0.3s ease;
}

.nav-back-link:hover {
  color: var(--gold);
  border-color: var(--gold);
  background: rgba(214, 160, 65, 0.08);
}

.event-stamp {
  font-family: 'Cinzel', serif;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: var(--gold);
}

/* Registration Card Container */
.reg-container {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 640px;
  background: var(--bg-card);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border-glass);
  border-radius: 24px;
  padding: 48px 40px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 60px rgba(214, 160, 65, 0.04);
  transition: border-color 0.3s ease;
}

.reg-container:hover {
  border-color: rgba(214, 160, 65, 0.25);
}

/* Header Typography */
.reg-header {
  text-align: center;
  margin-bottom: 36px;
}

.reg-badge {
  display: inline-block;
  font-family: 'Inter', sans-serif;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.35em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 12px;
  padding: 5px 16px;
  border-radius: 999px;
  border: 1px solid var(--border-gold);
  background: rgba(214, 160, 65, 0.06);
}

.reg-title {
  font-family: 'Cinzel', serif;
  font-size: clamp(2.2rem, 5vw, 3.2rem);
  font-weight: 900;
  color: #ffffff;
  letter-spacing: 0.08em;
  line-height: 1.1;
  margin-bottom: 4px;
}

.reg-subtitle {
  font-family: 'Alex Brush', cursive;
  font-size: clamp(1.8rem, 4vw, 2.4rem);
  color: var(--gold);
  margin-bottom: 12px;
}

.reg-lead {
  font-size: 0.95rem;
  color: var(--text-muted);
  max-width: 480px;
  margin: 0 auto;
}

/* Form Styles */
.reg-form {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
}

.form-label {
  font-family: 'Inter', sans-serif;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #e4e4e7;
  display: flex;
  align-items: center;
  gap: 4px;
}

.req-star {
  color: var(--gold);
  font-size: 0.9rem;
}

.form-input,
.form-textarea {
  width: 100%;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 12px;
  padding: 14px 18px;
  color: #ffffff;
  font-family: 'Figtree', sans-serif;
  font-size: 0.96rem;
  transition: all 0.25s ease;
  outline: none;
}

.form-textarea {
  resize: vertical;
  min-height: 80px;
}

.form-input::placeholder,
.form-textarea::placeholder {
  color: rgba(255, 255, 255, 0.65);
  opacity: 1;
}

.form-input:hover,
.form-textarea:hover {
  border-color: rgba(255, 255, 255, 0.25);
  background: rgba(255, 255, 255, 0.04);
}

.form-input:focus,
.form-textarea:focus {
  border-color: var(--gold);
  background: rgba(214, 160, 65, 0.05);
  box-shadow: 0 0 0 3px rgba(214, 160, 65, 0.15);
}

.form-input.is-invalid,
.form-textarea.is-invalid {
  border-color: var(--error);
  box-shadow: 0 0 0 3px var(--error-bg);
}

/* Gender Segmented Selection */
.gender-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.gender-option {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 13px 20px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 12px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  transition: all 0.25s ease;
  user-select: none;
}

.gender-option input[type="radio"] {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.gender-option:hover {
  border-color: rgba(214, 160, 65, 0.4);
  color: #ffffff;
  background: rgba(255, 255, 255, 0.05);
}

.gender-option.is-selected {
  border-color: var(--gold);
  background: rgba(214, 160, 65, 0.12);
  color: var(--gold);
  box-shadow: 0 0 20px rgba(214, 160, 65, 0.12);
  font-weight: 700;
}

.gender-radio-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s ease;
}

.gender-option.is-selected .gender-radio-dot {
  border-color: var(--gold);
}

.gender-radio-dot::after {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--gold);
  opacity: 0;
  transform: scale(0);
  transition: all 0.25s ease;
}

.gender-option.is-selected .gender-radio-dot::after {
  opacity: 1;
  transform: scale(1);
}

/* Error Text */
.field-error {
  font-size: 0.78rem;
  color: var(--error);
  display: none;
  align-items: center;
  gap: 4px;
  margin-top: 2px;
}

.field-error.show {
  display: flex;
}

/* Top Banner Alerts (General error or duplicate message) */
.alert-banner {
  display: none;
  padding: 14px 18px;
  border-radius: 12px;
  font-size: 0.88rem;
  line-height: 1.5;
  margin-bottom: 20px;
  align-items: flex-start;
  gap: 10px;
}

.alert-banner.alert-error {
  background: var(--error-bg);
  border: 1px solid var(--error-border);
  color: #fca5a5;
}

.alert-banner.alert-info {
  background: rgba(214, 160, 65, 0.1);
  border: 1px solid var(--border-gold);
  color: var(--gold-light);
}

.alert-banner.show {
  display: flex;
}

/* Submit Button */
.submit-btn {
  position: relative;
  width: 100%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  font-family: 'Inter', sans-serif;
  font-size: 0.88rem;
  font-weight: 800;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #050505;
  background: linear-gradient(135deg, #E5B25D 0%, #9B6A1D 100%);
  border: 1px solid #E5B25D;
  border-radius: 999px;
  padding: 17px 36px;
  cursor: pointer;
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 8px 30px rgba(214, 160, 65, 0.3);
  margin-top: 12px;
}

.submit-btn:hover:not(:disabled) {
  background: linear-gradient(135deg, #f5c575 0%, #b88028 100%);
  transform: translateY(-2px);
  box-shadow: 0 12px 40px rgba(214, 160, 65, 0.5);
}

.submit-btn:disabled {
  opacity: 0.75;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.spinner {
  display: none;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(5, 5, 5, 0.3);
  border-top-color: #050505;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ============================================================ */
/* SUCCESS STATE VIEW */
/* ============================================================ */
.success-container {
  display: none;
  text-align: center;
  padding: 20px 0;
  animation: successIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes successIn {
  from {
    opacity: 0;
    transform: scale(0.95) translateY(10px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

.success-badge-icon {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  background: rgba(214, 160, 65, 0.12);
  border: 1px solid var(--border-gold);
  color: var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 24px;
  box-shadow: 0 0 40px rgba(214, 160, 65, 0.2);
}

.success-badge-icon svg {
  width: 36px;
  height: 36px;
  stroke: var(--gold);
}

.success-title {
  font-family: 'Cinzel', serif;
  font-size: clamp(1.25rem, 2.5vw, 1.65rem);
  font-weight: 800;
  color: #ffffff;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}

.success-subtitle {
  font-family: 'Alex Brush', cursive;
  font-size: clamp(1.8rem, 4vw, 2.4rem);
  color: var(--gold);
  margin-bottom: 16px;
}

.success-desc {
  font-size: 1rem;
  color: #d4d4d8;
  max-width: 480px;
  margin: 0 auto 32px;
  line-height: 1.7;
}

.pass-card {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border-gold);
  border-radius: 16px;
  padding: 24px;
  max-width: 460px;
  margin: 0 auto 32px;
  text-align: left;
}

.pass-row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  font-size: 0.88rem;
}

.pass-row:last-child {
  border-bottom: none;
}

.pass-label {
  color: var(--text-muted);
  font-family: 'Inter', sans-serif;
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.pass-value {
  color: #ffffff;
  font-weight: 600;
  text-align: right;
}

.success-actions {
  display: flex;
  flex-direction: column;
  gap: 14px;
  align-items: center;
}

.success-main-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-family: 'Inter', sans-serif;
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #050505;
  background: linear-gradient(135deg, #E5B25D 0%, #9B6A1D 100%);
  padding: 15px 36px;
  border-radius: 999px;
  text-decoration: none;
  transition: all 0.3s ease;
  box-shadow: 0 6px 24px rgba(214, 160, 65, 0.3);
}

.success-main-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(214, 160, 65, 0.45);
}

.success-secondary-btn {
  font-family: 'Inter', sans-serif;
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px 16px;
  transition: color 0.3s ease;
}

.success-secondary-btn:hover {
  color: var(--gold);
}

/* Mobile Responsiveness */
@media (max-width: 640px) {
  body {
    padding: 24px 16px 60px;
  }

  .reg-container {
    padding: 32px 20px;
    border-radius: 20px;
  }

  .gender-grid {
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .pass-row {
    flex-direction: column;
    gap: 2px;
  }

  .pass-value {
    text-align: left;
  }
}
</style>
</head>
<body>

<canvas id="bgCanvas" class="bg-canvas"></canvas>
<div class="bg-spotlight"></div>

<!-- Top Navigation -->
<nav class="page-top-nav">
  <a href="../" class="nav-back-link">
    <span>←</span>
    <span>Return to YOTN 2026</span>
  </a>
  <span class="event-stamp">15 AUG 2026</span>
</nav>

<!-- Main Registration Card -->
<main class="reg-container" id="regCard">
  <!-- Form Header -->
  <header class="reg-header">
    <div class="reg-badge">FREEDOM FESTIVAL 2026</div>
    <h1 class="reg-title">REGISTRATION</h1>
  </header>

  <!-- Banner Alert (Dynamic) -->
  <div id="alertBanner" class="alert-banner" role="alert">
    <span id="alertMessage"></span>
  </div>

  <!-- Registration Form -->
  <form id="regForm" class="reg-form" novalidate>
    <!-- Field 1: NAME * -->
    <div class="form-group">
      <label for="nameInput" class="form-label">
        NAME <span class="req-star">*</span>
      </label>
      <input 
        type="text" 
        id="nameInput" 
        name="name" 
        class="form-input" 
        placeholder="Enter your name" 
        autocomplete="name"
      >
    </div>

    <!-- Field 2: CONTACT * -->
    <div class="form-group">
      <label for="contactInput" class="form-label">
        CONTACT <span class="req-star">*</span>
      </label>
      <input 
        type="text" 
        id="contactInput" 
        name="contact" 
        class="form-input" 
        placeholder="Enter your contact number" 
        autocomplete="tel"
      >
    </div>

    <!-- Field 3: CHURCH * -->
    <div class="form-group">
      <label for="churchInput" class="form-label">
        CHURCH / ORGANIZATION <span class="req-star">*</span>
      </label>
      <input 
        type="text" 
        id="churchInput" 
        name="church" 
        class="form-input" 
        placeholder="Enter your church name" 
        autocomplete="organization"
      >
    </div>

    <!-- Field 4: GENDER -->
    <div class="form-group">
      <label class="form-label">
        GENDER
      </label>
      <div class="gender-grid" role="radiogroup" aria-labelledby="genderLabel">
        <label class="gender-option" id="genderOptionMale">
          <input type="radio" name="gender" value="Male">
          <span class="gender-radio-dot"></span>
          <span>MALE</span>
        </label>
        <label class="gender-option" id="genderOptionFemale">
          <input type="radio" name="gender" value="Female">
          <span class="gender-radio-dot"></span>
          <span>FEMALE</span>
        </label>
      </div>
    </div>

    <!-- Field 5: OCCUPATION -->
    <div class="form-group">
      <label for="occupationInput" class="form-label">
        OCCUPATION
      </label>
      <input 
        type="text" 
        id="occupationInput" 
        name="occupation" 
        class="form-input" 
        placeholder="Student / Employee / Business / Other" 
        list="occupationSuggestions"
      >
      <datalist id="occupationSuggestions">
        <option value="Student">
        <option value="Employee">
        <option value="Business / Entrepreneur">
        <option value="Ministry / Worship Leader">
        <option value="Other">
      </datalist>
    </div>

    <!-- Field 6: ADDRESS -->
    <div class="form-group">
      <label for="addressInput" class="form-label">
        ADDRESS
      </label>
      <textarea 
        id="addressInput" 
        name="address" 
        class="form-textarea" 
        placeholder="Enter your address" 
        rows="3" 
        autocomplete="street-address"
      ></textarea>
    </div>

    <!-- Submit Button -->
    <button type="submit" id="submitBtn" class="submit-btn">
      <span class="spinner" id="btnSpinner"></span>
      <span id="btnText">REGISTER NOW</span>
    </button>
  </form>

  <!-- Success Confirmation View -->
  <section id="successView" class="success-container" aria-live="polite">
    <div class="success-badge-icon">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
      </svg>
    </div>

    <h2 class="success-title">REGISTRATION COMPLETE</h2>
    <div class="success-subtitle">Welcome to Freedom Festival</div>

    <p class="success-desc">
      Thank you for registering! <strong id="successName" style="color:var(--gold);"></strong>
    </p>

    <!-- Pass Summary Card -->
    <div class="pass-card">
      <div class="pass-row">
        <span class="pass-label">EVENT</span>
        <span class="pass-value" style="color:var(--gold);">Youth Of The Nation 2026</span>
      </div>
      <div class="pass-row">
        <span class="pass-label">DATE & TIME</span>
        <span class="pass-value">Sat, 15 August 2026 • 06:00 PM</span>
      </div>
      <div class="pass-row">
        <span class="pass-label">VENUE</span>
        <span class="pass-value">Balloon Room, Rajahmundry</span>
      </div>
      <div class="pass-row">
        <span class="pass-label">ATTENDEE</span>
        <span class="pass-value" id="summaryAttendee">—</span>
      </div>
      <div class="pass-row">
        <span class="pass-label">CONTACT</span>
        <span class="pass-value" id="summaryContact">—</span>
      </div>
    </div>

    <div class="success-actions">
      <a href="../" class="success-main-btn">
        <span>RETURN TO YOTN 2026</span>
        <span>→</span>
      </a>
      <button type="button" id="registerAnotherBtn" class="success-secondary-btn">
        + Register Another Attendee
      </button>
    </div>
  </section>
</main>

<script>
/* ============================================================ */
/* SUPABASE CLIENT INITIALIZATION */
/* ============================================================ */
let supabaseClient = null;

try {
  const config = window.SUPABASE_CONFIG || {
    url: 'https://yqdtvfsxffhrxfabstsk.supabase.co',
    anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlxZHR2ZnN4ZmZocnhmYWJzdHNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3NjY1MTgsImV4cCI6MjEwMjM0MjUxOH0.586sYXYAnD5kiy3y9sASvOSOXWkP10jQVAhtjOTFlEI'
  };

  if (window.supabase && window.supabase.createClient) {
    supabaseClient = window.supabase.createClient(config.url, config.anonKey);
  }
} catch (e) {
  console.warn('Supabase JS initialization notice:', e);
}

/* ============================================================ */
/* FORM INTERACTION & VALIDATION */
/* ============================================================ */
const regForm = document.getElementById('regForm');
const regCard = document.getElementById('regCard');
const successView = document.getElementById('successView');
const alertBanner = document.getElementById('alertBanner');
const alertMessage = document.getElementById('alertMessage');
const submitBtn = document.getElementById('submitBtn');
const btnSpinner = document.getElementById('btnSpinner');
const btnText = document.getElementById('btnText');
const registerAnotherBtn = document.getElementById('registerAnotherBtn');

// Fields
const nameInput = document.getElementById('nameInput');
const churchInput = document.getElementById('churchInput');
const occupationInput = document.getElementById('occupationInput');
const addressInput = document.getElementById('addressInput');
const contactInput = document.getElementById('contactInput');
const genderOptions = document.querySelectorAll('.gender-option');
const genderRadios = document.querySelectorAll('input[name="gender"]');

// Error Elements
const nameError = document.getElementById('nameError');
const genderError = document.getElementById('genderError');
const occupationError = document.getElementById('occupationError');
const contactError = document.getElementById('contactError');

let isSubmitting = false;

// Gender radio custom styling toggle
genderRadios.forEach(radio => {
  radio.addEventListener('change', () => {
    genderOptions.forEach(opt => opt.classList.remove('is-selected'));
    if (radio.checked) {
      radio.closest('.gender-option').classList.add('is-selected');
    }
  });
});

// Clear alerts on typing
[nameInput, churchInput, occupationInput, addressInput, contactInput].forEach(input => {

});

function showAlert(message, type = 'error') {

function hideAlert() {
  alertBanner.className = 'alert-banner';

}

/* ============================================================ */
/* FORM SUBMISSION HANDLER */
/* ============================================================ */
regForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  if (isSubmitting) return;
  hideAlert();

  // Gather payload without any blocking rules
  let selectedGender = '';
  genderRadios.forEach(r => { if (r.checked) selectedGender = r.value; });

  const rawName = nameInput.value.trim();
  const rawContact = contactInput.value.trim();
  const rawOccupation = occupationInput.value.trim();
  const rawChurch = churchInput.value.trim();
  const rawAddress = addressInput.value.trim();

  const payload = {
    name: rawName || 'Attendee',
    church: rawChurch || null,
    gender: selectedGender || 'Not Specified',
    occupation: rawOccupation || 'General',
    address: rawAddress || null,
    contact: rawContact || 'N/A'
  };

  // Set Loading State
  isSubmitting = true;
  submitBtn.disabled = true;
  btnSpinner.style.display = 'inline-block';
  btnText.textContent = 'REGISTERING...';

  try {
    let result = null;

    if (supabaseClient) {
      const { data, error } = await supabaseClient
        .from('registrations')
        .insert([payload])
        .select();

      if (error) throw error;
      result = data;
    } else {
      result = await insertRegistrationDirect(payload);
    }

    // Success Transition
    showSuccessState(payload);

  } catch (err) {
    console.error('Registration submission error:', err);

    if (err.code === '23505' || (err.message && err.message.toLowerCase().includes('duplicate'))) {
      showAlert('A registration with this contact number already exists.', 'info');
    } else if (err.code === '42501' || (err.message && err.message.includes('row-level security'))) {
      showAlert('Row Level Security (RLS) is blocking inserts. Please run the SQL policy script in your Supabase SQL Editor to allow public registrations.');
    } else {
      showAlert('Something went wrong while completing your registration. Please try again.');
    }

    // Reset button state on failure
    isSubmitting = false;
    submitBtn.disabled = false;
    btnSpinner.style.display = 'none';
    btnText.textContent = 'REGISTER NOW';
  }
});

function showSuccessState(data) {
  regForm.style.display = 'none';
  document.querySelector('.reg-header').style.display = 'none';
  hideAlert();

  document.getElementById('successName').textContent = data.name;
  document.getElementById('summaryAttendee').textContent = data.name;
  document.getElementById('summaryContact').textContent = data.contact;

  successView.style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Register Another Person
registerAnotherBtn.addEventListener('click', () => {
  regForm.reset();
  genderOptions.forEach(opt => opt.classList.remove('is-selected'));
  hideAlert();

  isSubmitting = false;
  submitBtn.disabled = false;
  btnSpinner.style.display = 'none';
  btnText.textContent = 'REGISTER NOW';

  successView.style.display = 'none';
  document.querySelector('.reg-header').style.display = 'block';
  regForm.style.display = 'flex';
  nameInput.focus();
});

/* ============================================================ */
/* AMBIENT BACKGROUND PARTICLES */
/* ============================================================ */
(function initAmbientCanvas() {
  const canvas = document.getElementById('bgCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let w = canvas.width = window.innerWidth;
  let h = canvas.height = window.innerHeight;

  window.addEventListener('resize', () => {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  });

  const particles = Array.from({ length: 30 }, () => ({
    x: Math.random() * w,
    y: Math.random() * h,
    r: Math.random() * 1.8 + 0.5,
    vy: -Math.random() * 0.3 - 0.08,
    alpha: Math.random() * 0.5 + 0.15
  }));

  function animate() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      p.y += p.vy;
      if (p.y < 0) p.y = h;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(214, 160, 65, ${p.alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(animate);
  }
  animate();
})();
