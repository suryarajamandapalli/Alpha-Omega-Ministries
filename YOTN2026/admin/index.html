<script>
/* ============================================================ */

const POLL_QUESTIONS = [

    options: [

    ]
  },
  {
    number: 2,
    question: "Do you think every Indian citizen enjoys the same level of freedom, regardless of religion, gender, or class?",
    options: [
      { key: "A", text: "Yes, freedom is equal for all" },
      { key: "B", text: "No, some enjoy more freedom than others" },
      { key: "C", text: "It depends on where you live" },
      { key: "D", text: "I've never really thought about it" }
    ]
  },
  {

    question: "Is freedom the same as doing whatever you want, whenever you want?",
    options: [
      { key: "A", text: "Yes" },
      { key: "B", text: "No. Freedom comes with responsibility" },
      { key: "C", text: "Freedom is more about having choices, not doing everything" },
      { key: "D", text: "I'm not sure" }
    ]
  },
  {
    number: 4,
    question: "How do you define the idea of freedom?",
    options: [
      { key: "A", text: "No one controlling my decisions" },
      { key: "B", text: "Being able to speak my mind without fear" },
      { key: "C", text: "Freedom from my own fears, guilt, and habits" },
      { key: "D", text: "Something deeper than any of the above" }
    ]
  },
  {
    number: 5,
    question: "Do you think that the youth can actually change the nation?",
    options: [
      { key: "A", text: "Yes" },
      { key: "B", text: "No" }
    ]
  },
  {
    number: 6,
    isEmojiReaction: true,
    question: "How did you like the Polls and Interaction?",
    options: [
      { key: "love", text: "😍 Love it" },
      { key: "clap", text: "👏🏻 Great" },
      { key: "like", text: "👍 Like" },
      { key: "happy", text: "😀 Good" },
      { key: "dislike", text: "👎 Didn't like it" }
    ]
  }
];

let supabaseClient = null;
let adminToken = sessionStorage.getItem('yotn_admin_session') || '';
let pollsDbData = [];
let allVotesData = [];
let pendingAction = null;

try {
  const config = window.SUPABASE_CONFIG || {
    url: 'https://yqdtvfsxffhrxfabstsk.supabase.co',
    anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlxZHR2ZnN4ZmZocnhmYWJzdHNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3NjY1MTgsImV4cCI6MjEwMjM0MjUxOH0.586sYXYAnD5kiy3y9sASvOSOXWkP10jQVAhtjOTFlEI'
  };
  if (window.supabase && window.supabase.createClient) {
    supabaseClient = window.supabase.createClient(config.url, config.anonKey);
  }
} catch (e) {}

const loginScreen = document.getElementById('loginScreen');
const loginForm = document.getElementById('loginForm');
const adminPassword = document.getElementById('adminPassword');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const dashboardScreen = document.getElementById('dashboardScreen');
const logoutBtn = document.getElementById('logoutBtn');
const resetVotesBtn = document.getElementById('resetVotesBtn');
const liveHeroContent = document.getElementById('liveHeroContent');
const noLiveContent = document.getElementById('noLiveContent');
const liveTotalVotes = document.getElementById('liveTotalVotes');
const liveQuestionTitle = document.getElementById('liveQuestionTitle');
const liveOptionsTally = document.getElementById('liveOptionsTally');
const endLivePollBtn = document.getElementById('endLivePollBtn');
const allQuestionsGrid = document.getElementById('allQuestionsGrid');

const confirmModal = document.getElementById('confirmModal');
const modalTitle = document.getElementById('modalTitle');
const modalDesc = document.getElementById('modalDesc');
const modalCancelBtn = document.getElementById('modalCancelBtn');
const modalConfirmBtn = document.getElementById('modalConfirmBtn');

/* ============================================================ */
/* AUTHENTICATION */
/* ============================================================ */
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  loginError.classList.remove('show');
  const pwd = adminPassword.value;
  if (!pwd) return;

  try {
    const res = await fetch('/api/admin-auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd })
    });
    const data = await res.json();
    if (res.ok && data.token) {
      adminToken = data.token;
      sessionStorage.setItem('yotn_admin_session', adminToken);
      showDashboard();
    } else {
      showLoginError(data.error || 'Invalid admin credentials.');
    }
  } catch (err) {
    showLoginError('Invalid admin credentials.');
  }
});

function showLoginError(msg) {
  loginError.textContent = msg;
  loginError.classList.add('show');
}

logoutBtn.addEventListener('click', () => {
  sessionStorage.removeItem('yotn_admin_session');
  adminToken = '';
  dashboardScreen.style.display = 'none';
  loginScreen.style.display = 'block';
  adminPassword.value = '';
});

/* ============================================================ */
/* DASHBOARD SYNC */
/* ============================================================ */
async function fetchAndRenderDashboard() {
  if (!supabaseClient) return;
  try {
    const { data: polls } = await supabaseClient
      .from('polls')
      .select('*')
      .order('question_number', { ascending: true });

    if (polls) pollsDbData = polls;

    const { data: options } = await supabaseClient.from('poll_options').select('*');
    const { data: votes } = await supabaseClient.from('poll_votes').select('*');
    if (votes) allVotesData = votes;

    renderDashboardUI(pollsDbData, options || [], allVotesData);
  } catch (err) {}
}

function renderDashboardUI(polls, options, votes) {
  const livePoll = polls.find(p => p.is_active === true);

  if (livePoll) {
    liveHeroContent.style.display = 'block';
    noLiveContent.style.display = 'none';

    liveQuestionTitle.textContent = `QUESTION 0${livePoll.question_number}: ${livePoll.question}`;

    const pollOpts = options.filter(o => o.poll_id === livePoll.id);
    const pollVotes = votes.filter(v => v.poll_id === livePoll.id);
    const totalVotes = pollVotes.length;

    liveTotalVotes.textContent = `${totalVotes} TOTAL ${totalVotes === 1 ? 'VOTE' : 'VOTES'}`;

    liveOptionsTally.innerHTML = '';
    const qMeta = POLL_QUESTIONS.find(q => q.number === livePoll.question_number) || { options: [] };

    qMeta.options.forEach(optMeta => {
      const optRecord = pollOpts.find(o => o.option_key === optMeta.key);
      const optVotes = optRecord ? pollVotes.filter(v => v.option_id === optRecord.id).length : 0;
      const pct = totalVotes > 0 ? Math.round((optVotes / totalVotes) * 100) : 0;

      const row = document.createElement('div');
      row.className = 'tally-row';
      row.innerHTML = `
        <div class="tally-bar-fill" style="width:${pct}%;"></div>
        <div class="tally-content">
          <span class="tally-text"><strong style="color:var(--gold);">${optMeta.key}</strong> • ${optMeta.text}</span>
          <div class="tally-stats">
            <span class="tally-pct">${pct}%</span>
            <span class="tally-count">${optVotes} ${optVotes === 1 ? 'vote' : 'votes'}</span>
          </div>
        </div>
      `;
      liveOptionsTally.appendChild(row);
    });

    endLivePollBtn.onclick = () => {
      confirmAction(
        `END QUESTION 0${livePoll.question_number}?`,
        'The audience will no longer be able to submit votes on this question.',
        () => setPollStatus(livePoll.question_number, 'CLOSED')
      );
    };
  } else {
    liveHeroContent.style.display = 'none';
    noLiveContent.style.display = 'block';
  }

  // Render All 6 Questions
  allQuestionsGrid.innerHTML = '';
  POLL_QUESTIONS.forEach(q => {
    const dbPoll = polls.find(p => p.question_number === q.number);
    const isLive = dbPoll && dbPoll.is_active === true;
    const isClosed = dbPoll && dbPoll.status === 'CLOSED';
    const statusText = isLive ? 'LIVE' : (isClosed ? 'CLOSED' : 'UPCOMING');
    const statusClass = isLive ? 'status-live' : (isClosed ? 'status-closed' : 'status-upcoming');
    const qVotes = dbPoll ? votes.filter(v => v.poll_id === dbPoll.id).length : 0;

    const card = document.createElement('div');
    card.className = `question-admin-card ${isLive ? 'is-live' : ''}`;
    card.innerHTML = `
      <div>
        <div class="q-header-row">
          <span class="q-num-badge">QUESTION 0${q.number}</span>
          ${q.isEmojiReaction ? '<span style="font-family:Inter; font-size:0.68rem; font-weight:800; color:#F3CA7E; background:rgba(214,160,65,0.15); padding:2px 8px; border-radius:4px; border:1px solid rgba(214,160,65,0.3);">✨ EMOJI REACTION</span>' : ''}
          <span class="q-status-badge ${statusClass}">● ${statusText}</span>
          <span style="font-size:0.75rem; color:var(--text-muted);">${qVotes} ${qVotes === 1 ? 'vote' : 'votes'}</span>
        </div>
        <div class="q-body-text">${q.question}</div>
      </div>
      <div>
        ${isLive ? `
          <button type="button" class="end-poll-btn" onclick="triggerEndPoll(${q.number})">■ END POLL</button>
        ` : `
          <button type="button" class="make-live-btn" onclick="triggerMakeLive(${q.number})">▶ MAKE LIVE</button>
        `}
      </div>
    `;
    allQuestionsGrid.appendChild(card);
  });
}

/* ============================================================ */
/* SET POLL STATUS */
/* ============================================================ */
async function setPollStatus(questionNumber, status) {
  try {
    if (supabaseClient) {
      if (status === 'LIVE') {
        await supabaseClient.from('polls').update({ is_active: false }).neq('question_number', questionNumber);
        await supabaseClient.from('polls').update({ is_active: true, status: 'LIVE' }).eq('question_number', questionNumber);
      } else {
        await supabaseClient.from('polls').update({ is_active: false, status: 'CLOSED' }).eq('question_number', questionNumber);
      }
    }

    fetch('/api/admin-poll', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${adminToken}`
      },
      body: JSON.stringify({ action: 'set-status', questionNumber, status })
    }).catch(e => {});

    await fetchAndRenderDashboard();
  } catch (e) {
    await fetchAndRenderDashboard();
  }
}

/* ============================================================ */
/* RESET ALL VOTES */
/* ============================================================ */
resetVotesBtn.addEventListener('click', () => {
  confirmAction(
    'RESET ALL POLL VOTES?',
    'This will permanently wipe all audience votes from the database and set all tallies back to 0. Are you sure?',
    async () => {
      try {
        if (supabaseClient) {
          try { await supabaseClient.rpc('reset_all_votes'); } catch (e) {}
          await supabaseClient.from('poll_votes').delete().not('id', 'is', null);
        }

        fetch('/api/admin-poll', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${adminToken}`
          },
          body: JSON.stringify({ action: 'reset-votes' })
        }).catch(e => {});

        allVotesData = [];
        await fetchAndRenderDashboard();
      } catch (err) {
        allVotesData = [];
        await fetchAndRenderDashboard();
      }
    }
  );
});

/* Modal Trigger */
window.triggerMakeLive = function(qNum) {
  confirmAction(`MAKE QUESTION 0${qNum} LIVE?`, `This will immediately broadcast Question 0${qNum} to all audience screens.`, () => setPollStatus(qNum, 'LIVE'));
};

window.triggerEndPoll = function(qNum) {
  confirmAction(`END QUESTION 0${qNum}?`, `Audience will no longer be able to vote on Question 0${qNum}.`, () => setPollStatus(qNum, 'CLOSED'));
};

function confirmAction(title, desc, onConfirm) {
  modalTitle.textContent = title;
  modalDesc.textContent = desc;
  pendingAction = onConfirm;
  confirmModal.classList.add('show');
}

modalCancelBtn.addEventListener('click', () => { confirmModal.classList.remove('show'); pendingAction = null; });
modalConfirmBtn.addEventListener('click', async () => {
  confirmModal.classList.remove('show');
  if (typeof pendingAction === 'function') await pendingAction();
  pendingAction = null;
});

function showDashboard() {
  loginScreen.style.display = 'none';
  dashboardScreen.style.display = 'block';
  fetchAndRenderDashboard();
  setInterval(() => {
    if (dashboardScreen.style.display !== 'none') fetchAndRenderDashboard();
  }, 2000);
}

document.addEventListener('DOMContentLoaded', () => {
  if (adminToken) showDashboard();
});
</script>
